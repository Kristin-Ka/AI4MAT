[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matprop-nn"
version = "0.2.0"
description = "Benchmark pipeline for crystal-property prediction using Materials Project data."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "torch>=2.1",
    "torch-geometric",
    "lightning>=2.0",
    "torchmetrics",
    "matgl>=2.0",
    "pymatgen-core",
    "mp-api",
    "ase",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "scikit-learn",
    "monty",
    "xgboost",
    "matminer",
    "tabulate",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "ipykernel", "jupyterlab"]
tracking = ["mlflow", "wandb"]
gnn = ["chgnet>=0.4", "alignn>=2024", "dgl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
