model:
  arch: "tensornet"
  cutoff: 5.0
  units: 64
  nblocks: 3
  num_rbf: 32
  readout_type: "weighted_atom"
  is_intensive: true
  ntargets: 1
  activation_type: "swish"

training:
  max_epochs: 200
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 0.0
  patience: 20
  seed: 42
  num_workers: 0
  accelerator: "auto"
  log_dir: "results/tensornet"
