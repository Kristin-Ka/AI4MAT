model:
  arch: "mlp"
  # Matches the xgboost baseline feature set (Magpie + density = 135 feats).
  feature_groups: ["elem_prop", "density"]
  hidden_dims: [256, 128, 64]
  dropout: 0.1

training:
  max_epochs: 200
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  patience: 20
  seed: 42
  accelerator: "auto"
  log_dir: "results/mlp"
  featurizer_n_jobs: 2    # 2 workers keeps RSS ~5 GB on 150k rows

